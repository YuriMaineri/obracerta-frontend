<div class="header">
  <a routerLink="/customers" class="back">‹ Clientes</a>
  <h1>{{ isEditing ? 'Editar cliente' : 'Novo cliente' }}</h1>
</div>

@if (error(); as message) {
  <div class="alert-error" role="alert">{{ message }}</div>
}

<form class="card" [formGroup]="form" (ngSubmit)="save()" novalidate>
  <fieldset>
    <legend>Identificação</legend>

    <div class="person-type" role="radiogroup" aria-label="Tipo de pessoa">
      <label><input type="radio" formControlName="personType" value="COMPANY" /> Pessoa jurídica</label>
      <label><input type="radio" formControlName="personType" value="INDIVIDUAL" /> Pessoa física</label>
    </div>

    <div class="grid">
      <label class="wide">
        {{ isCompany ? 'Razão social' : 'Nome' }} *
        <input formControlName="name" autocomplete="off" />
        @if (fieldError('name'); as msg) { <small class="field-error">{{ msg }}</small> }
      </label>

      <label>
        {{ isCompany ? 'CNPJ' : 'CPF' }}
        <input
          formControlName="taxId"
          [appMask]="isCompany ? 'cnpj' : 'cpf'"
          [placeholder]="isCompany ? '00.000.000/0000-00' : '000.000.000-00'"
        />
        @if (fieldError('taxId'); as msg) { <small class="field-error">{{ msg }}</small> }
      </label>

      <label>
        A/C (pessoa de contato)
        <input formControlName="contactPerson" placeholder="Ex.: Sra. Maris Gundlach" />
        @if (fieldError('contactPerson'); as msg) { <small class="field-error">{{ msg }}</small> }
      </label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Contato</legend>
    <div class="grid">
      <label>
        Telefone
        <input formControlName="phone" type="tel" [appMask]="'phone'" placeholder="(51) 99999-9999" />
        @if (fieldError('phone'); as msg) { <small class="field-error">{{ msg }}</small> }
      </label>
      <label>
        E-mail
        <input formControlName="email" type="email" autocomplete="off" placeholder="nome@empresa.com.br" />
        @if (fieldError('email'); as msg) { <small class="field-error">{{ msg }}</small> }
      </label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Endereço</legend>
    <div class="grid">
      <label class="wide">
        Logradouro e número
        <input formControlName="address" />
        @if (fieldError('address'); as msg) { <small class="field-error">{{ msg }}</small> }
      </label>
      <label>
        Bairro
        <input formControlName="district" />
        @if (fieldError('district'); as msg) { <small class="field-error">{{ msg }}</small> }
      </label>
      <label>
        Cidade
        <input formControlName="city" />
        @if (fieldError('city'); as msg) { <small class="field-error">{{ msg }}</small> }
      </label>
      <label>
        CEP
        <input formControlName="postalCode" [appMask]="'postalCode'" placeholder="00000-000" />
        @if (fieldError('postalCode'); as msg) { <small class="field-error">{{ msg }}</small> }
      </label>
    </div>
  </fieldset>

  <div class="footer">
    <a class="btn" routerLink="/customers">Cancelar</a>
    <button class="btn primary" type="submit" [disabled]="saving()">
      {{ saving() ? 'Salvando…' : 'Salvar' }}
    </button>
  </div>
</form>
