@if (user(); as u) {
  <header class="topbar">
    <a class="brand" routerLink="/">ObraCerta</a>
    <a class="nav-item" routerLink="/customers" routerLinkActive="active">Clientes</a>
    <a class="nav-item" routerLink="/estimates" routerLinkActive="active">Orçamentos</a>
    <a class="nav-item" routerLink="/catalog" routerLinkActive="active">Catálogo</a>
    <a class="nav-item" routerLink="/company" routerLinkActive="active">Empresa</a>
    <div class="session">
      @if (companyName(); as name) {
        <span class="company-name">{{ name }}</span>
      }
      <span class="user" [title]="u.email">{{ u.name }}</span>
      <button type="button" class="link" (click)="passwordDialog.set(true)">Trocar senha</button>
      <button type="button" class="link" (click)="logout()">Sair</button>
    </div>
  </header>
}

<router-outlet />

@if (passwordDialog()) {
  <app-password-dialog (closed)="passwordDialog.set(false)" />
}
