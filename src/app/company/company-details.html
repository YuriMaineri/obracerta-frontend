@if (error(); as message) {
  <div class="alert-error" role="alert">{{ message }}</div>
}

<section class="card logo-card">
  <div class="logo-preview">
    @if (hasLogo()) {
      <img [src]="logoUrl()" alt="Logotipo da empresa" />
    } @else {
      <span>Sem logotipo</span>
    }
  </div>
  <div class="logo-actions">
    <strong>Logotipo</strong>
    <p>Aparece no cabeçalho da proposta. PNG ou JPEG, até 1 MB.</p>
    <div class="buttons">
      <label class="btn small">
        {{ hasLogo() ? 'Trocar imagem' : 'Enviar imagem' }}
        <input type="file" accept="image/png,image/jpeg" hidden #logoInput (change)="onLogoSelected(logoInput)" />
      </label>
      @if (hasLogo()) {
        <button type="button" class="btn small danger" (click)="removeLogo()">Remover</button>
      }
    </div>
    @if (logoError(); as msg) { <small class="field-error">{{ msg }}</small> }
  </div>
</section>

<form class="card form-card" [formGroup]="form" (ngSubmit)="save()" novalidate>
  <fieldset>
    <legend>Identificação</legend>
    <div class="grid">
      <label class="wide">
        Razão social *
        <input formControlName="legalName" />
        @if (fieldError('legalName'); as msg) { <small class="field-error">{{ msg }}</small> }
      </label>
      <label class="wide">
        Nome fantasia
        <input formControlName="tradeName" placeholder="Nome que aparece para o cliente" />
        @if (fieldError('tradeName'); as msg) { <small class="field-error">{{ msg }}</small> }
      </label>
      <label>
        CNPJ
        <input formControlName="taxId" [appMask]="'cnpj'" placeholder="00.000.000/0000-00" />
        @if (fieldError('taxId'); as msg) { <small class="field-error">{{ msg }}</small> }
      </label>
      <label>
        Responsável (assina a proposta)
        <input formControlName="signatoryName" />
        @if (fieldError('signatoryName'); as msg) { <small class="field-error">{{ msg }}</small> }
      </label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Contato</legend>
    <div class="grid">
      <label>
        Telefone
        <input formControlName="phone" type="tel" [appMask]="'phone'" placeholder="(51) 99999-9999" />
        @if (fieldError('phone'); as msg) { <small class="field-error">{{ msg }}</small> }
      </label>
      <label>
        E-mail
        <input formControlName="email" type="email" placeholder="nome@empresa.com.br" />
        @if (fieldError('email'); as msg) { <small class="field-error">{{ msg }}</small> }
      </label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Endereço</legend>
    <div class="grid">
      <label class="wide">
        Logradouro e número
        <input formControlName="address" />
        @if (fieldError('address'); as msg) { <small class="field-error">{{ msg }}</small> }
      </label>
      <label>
        Bairro
        <input formControlName="district" />
        @if (fieldError('district'); as msg) { <small class="field-error">{{ msg }}</small> }
      </label>
      <label>
        Cidade
        <input formControlName="city" />
        @if (fieldError('city'); as msg) { <small class="field-error">{{ msg }}</small> }
      </label>
      <label>
        CEP
        <input formControlName="postalCode" [appMask]="'postalCode'" placeholder="00000-000" />
        @if (fieldError('postalCode'); as msg) { <small class="field-error">{{ msg }}</small> }
      </label>
    </div>
  </fieldset>

  <div class="form-footer">
    @if (saved() && form.pristine) { <span class="saved">Dados salvos.</span> }
    <button class="btn primary" type="submit" [disabled]="saving()">
      {{ saving() ? 'Salvando…' : 'Salvar' }}
    </button>
  </div>
</form>
